# ══════════════════════════════════════════════════════════
#  TRINITY — VirtualHost de ejemplo (Apache 2.4 + mod_php)
#
#  Instalación (Ubuntu/Debian):
#    sudo a2enmod rewrite php8.3       # (mod_rewrite + PHP)
#    sudo cp apache/trinity.conf /etc/apache2/sites-available/trinity.conf
#    # editar DocumentRoot/ServerName más abajo según tu entorno
#    sudo a2ensite trinity.conf
#    sudo systemctl reload apache2
#
#  En XAMPP/WAMP: copiar el bloque <VirtualHost> dentro del
#  httpd-vhosts.conf correspondiente y agregar la línea de
#  ServerName al archivo hosts del sistema operativo.
# ══════════════════════════════════════════════════════════

<VirtualHost *:80>
    ServerName trinity.local

    # IMPORTANTE: el DocumentRoot apunta a la RAÍZ de este proyecto
    # (la carpeta que contiene index.html, api/, assets/, etc.),
    # no a una subcarpeta "public/". assets/js/api.js detecta la
    # ruta base solo, así que si preferís servirlo desde una
    # subcarpeta (http://localhost/Trinity/) no hace falta tocar
    # nada del front-end.
    DocumentRoot /var/www/trinity

    <Directory /var/www/trinity>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Redundante con el .htaccess del proyecto, pero se deja también
    # a nivel de vhost por si alguna vez se corre con AllowOverride None.
    <Directory /var/www/trinity/api/src>
        Require all denied
    </Directory>
    <Directory /var/www/trinity/vendor>
        Require all denied
    </Directory>
    <Directory /var/www/trinity/scripts>
        Require all denied
    </Directory>
    <Directory /var/www/trinity/WhatsApp>
        Require all denied
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/trinity_error.log
    CustomLog ${APACHE_LOG_DIR}/trinity_access.log combined
</VirtualHost>

# ── Alternativa: PHP-FPM en vez de mod_php ──────────────────
# Si el servidor corre PHP-FPM (más común en producción), agregar
# dentro del <VirtualHost> de arriba:
#
#   <FilesMatch \.php$>
#       SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
#   </FilesMatch>
